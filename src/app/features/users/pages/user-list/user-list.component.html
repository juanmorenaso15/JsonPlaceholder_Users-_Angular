<section class="user-list">
    <header class="user-list__header">
        <h2>Lista de Usuarios</h2>
        <span>{{ users.length }} usuarios encontrados</span>
    </header>

    <div class="user-list__grid">
        <app-user-card *ngFor="let user of users" [user]="user">
        </app-user-card>
    </div>
</section>
